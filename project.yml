name: Unload
options:
  bundleIdPrefix: com.ericdev.unload
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
targets:
  Unload iOS:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: iOS
    dependencies:
      - target: DumpIt Widgets
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: DumpIt
        CFBundleURLTypes:
          - CFBundleURLName: com.ericdev.unload.ios
            CFBundleURLSchemes: [dumpit]
        UILaunchScreen:
          UIColorName: Cream
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ericdev.unload.ios
        PRODUCT_NAME: DumpIt
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
  Unload macOS:
    type: application
    platform: macOS
    sources:
      - path: Shared
      - path: macOS
    info:
      path: macOS/Info.plist
      properties:
        CFBundleDisplayName: DumpIt
        LSApplicationCategoryType: public.app-category.healthcare-fitness
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ericdev.unload.macos
        PRODUCT_NAME: DumpIt
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  DumpIt Widgets:
    type: app-extension
    platform: iOS
    sources:
      - path: WidgetExtension
      - path: Shared/JournalStore.swift
      - path: Shared/BinTier.swift
      - path: Shared/ClearTheme.swift
    info:
      path: WidgetExtension/Info.plist
      properties:
        CFBundleDisplayName: DumpIt
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ericdev.unload.ios.widgets
        PRODUCT_NAME: DumpItWidgets
        SKIP_INSTALL: YES
